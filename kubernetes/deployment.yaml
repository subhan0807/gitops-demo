apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: gitops-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: subhan0807/gitops-demo:v1

          ports:
            - containerPort: 80
